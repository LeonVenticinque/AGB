<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloomay</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #333;
            margin: 0;
            line-height: 1.7;
        }

        header {
            background: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            color: #d63384;
            margin: 0 0 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            text-decoration: none;
            background: #d63384;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .welcome {
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        footer a {
            color: #d63384;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 15px;
                padding: 25px;
            }

            nav a {
                padding: 8px 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌸 Bloomay</h1>

    <nav>
        <a href="index.html">Startseite</a>
        <a href="agb.html">AGB</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="impressum.html">Impressum</a>
    </nav>
</header>

<div class="container">

    <h2>Willkommen bei Bloomay 🌸</h2>

    <p class="welcome">
        Individuell angefertigte Blumensträuße mit viel Liebe zum Detail.
    </p>

    <p>
        Vielen Dank für dein Vertrauen!
    </p>

</div>

<footer>
    <a href="agb.html">AGB</a> |
    <a href="datenschutz.html">Datenschutz</a> |
    <a href="impressum.html">Impressum</a>
</footer>

</html>
